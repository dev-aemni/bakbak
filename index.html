<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b141a">
    <title>BakBak</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.svg">
    <link rel="stylesheet" href="styles.css?v=3">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Direct message navigation">
        <header class="brand">
          <div>
            <strong>BakBak</strong>
            <span>Direct messages</span>
          </div>
          <button id="themeToggle" class="icon-btn" title="Toggle theme">O</button>
        </header>

        <section class="panel account-panel">
          <div class="panel__title">Account</div>
          <div id="currentAccount" class="current-account"></div>
          <input type="file" id="pfpUpload" accept="image/*" hidden>
          <button id="uploadPfpBtn" class="tool-pill" style="display:none; margin: 0 8px 8px;">Upload PFP</button>
          
          <form id="accountForm" class="account-form">
            <input id="displayNameInput" type="text" autocomplete="name" placeholder="Display name (Empty to login)">
            <input id="usernameInput" type="text" autocomplete="username" placeholder="Username" required>
            <input id="passwordInput" type="password" autocomplete="new-password" placeholder="Password" required>
            <button type="submit">Login / Register</button>
          </form>
          <p id="accountStatus" class="form-status" role="status"></p>
        </section>

        <section class="panel">
          <div class="panel__title">Add Friend</div>
          <form id="dmByIdForm" class="dm-id-form">
            <input id="dmUserIdInput" type="text" autocomplete="off" placeholder="Enter username">
            <button type="submit">Add</button>
          </form>
        </section>

        <section class="panel">
          <div class="panel__title">Friends</div>
          <div id="dmList" class="nav-list"></div>
        </section>
      </aside>

      <main class="chat">
        <header class="chat-header">
          <button id="mobileMenu" class="icon-btn mobile-only" title="Open navigation">Menu</button>
          <div>
            <h1 id="roomName">Direct messages</h1>
            <p id="roomTopic">Select a friend to start chatting</p>
          </div>
          <div class="header-actions">
            <button class="icon-btn" id="voiceBtn" title="Voice call">Call</button>
            <button class="icon-btn" id="videoBtn" title="Video call">Cam</button>
          </div>
        </header>

        <div class="workspace">
          <section class="message-pane">
            <div id="messageList" class="messages" aria-live="polite"></div>

            <form id="composer" class="composer">
              <input id="fileInput" type="file" multiple hidden>
              <button type="button" id="attachBtn" class="icon-btn" title="Attach files">+</button>
              <textarea id="messageInput" rows="1" placeholder="Message your friend..."></textarea>
              <button class="send-btn" title="Send message">Send</button>
            </form>
          </section>
        </div>
      </main>
    </div>

    <script src="socket.io/socket.io.js"></script>
    <script>
      const script = document.createElement("script");
      script.src = "app-account.js?v=2";
      document.body.appendChild(script);
    </script>
  </body>
</html>
