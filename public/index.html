<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b141a">
    <title>BakBak</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon-192.svg">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="rail" aria-label="Servers">
        <button class="rail__logo" title="BakBak">B</button>
        <div id="serverRail" class="rail__servers"></div>
        <button class="rail__button" title="Server discovery">⌕</button>
        <button class="rail__button" title="Settings">⚙</button>
      </aside>

      <aside class="sidebar" aria-label="Navigation">
        <header class="brand">
          <div>
            <strong>BakBak</strong>
            <span>Community chat</span>
          </div>
          <button id="themeToggle" class="icon-btn" title="Toggle theme">◐</button>
        </header>

        <label class="search-box">
          <span>⌕</span>
          <input id="globalSearch" type="search" placeholder="Search messages, files, users">
        </label>

        <section class="panel">
          <div class="panel__title">Channels</div>
          <div id="channelList" class="nav-list"></div>
        </section>

        <section class="panel">
          <div class="panel__title">Direct</div>
          <div id="dmList" class="nav-list"></div>
        </section>

        <section class="panel compact">
          <div class="panel__title">Smart tools</div>
          <button class="tool-pill" data-smart="summary">AI summary</button>
          <button class="tool-pill" data-smart="translate">Translate</button>
          <button class="tool-pill" data-smart="moderate">Mod queue</button>
          <button class="tool-pill" data-smart="bots">Bots/API</button>
        </section>
      </aside>

      <main class="chat">
        <header class="chat-header">
          <button id="mobileMenu" class="icon-btn mobile-only" title="Open navigation">☰</button>
          <div>
            <h1 id="roomName"># general</h1>
            <p id="roomTopic">Real-time public chat</p>
          </div>
          <div class="header-actions">
            <button class="icon-btn" id="voiceBtn" title="Voice call">☎</button>
            <button class="icon-btn" id="videoBtn" title="Video call">▣</button>
            <button class="icon-btn" id="screenBtn" title="Screen share">⇱</button>
            <button class="icon-btn" id="profileBtn" title="Profile">A</button>
          </div>
        </header>

        <div class="workspace">
          <section class="message-pane">
            <div id="pinnedBar" class="pinned-bar hidden"></div>
            <div id="typingLine" class="typing-line"></div>
            <div id="messageList" class="messages" aria-live="polite"></div>

            <form id="composer" class="composer">
              <input id="fileInput" type="file" multiple hidden>
              <button type="button" id="attachBtn" class="icon-btn" title="Attach files">＋</button>
              <button type="button" id="voiceNoteBtn" class="icon-btn" title="Voice note">●</button>
              <textarea id="messageInput" rows="1" placeholder="Message BakBak"></textarea>
              <button type="button" id="gifBtn" class="icon-btn" title="GIF/sticker">☺</button>
              <button class="send-btn" title="Send message">➤</button>
            </form>
            <div id="dropZone" class="drop-zone">Drop files to upload</div>
          </section>

          <aside class="details" aria-label="Community details">
            <section class="stats-grid">
              <div><strong id="onlineCount">2</strong><span>Online</span></div>
              <div><strong id="messageCount">0</strong><span>Messages</span></div>
              <div><strong>112</strong><span>Features</span></div>
              <div><strong>PWA</strong><span>Ready</span></div>
            </section>

            <section class="detail-card">
              <h2>Members</h2>
              <div id="memberList" class="member-list"></div>
            </section>

            <section class="detail-card">
              <h2>Events</h2>
              <div id="eventList" class="mini-list"></div>
            </section>

            <section class="detail-card">
              <h2>Poll</h2>
              <div id="pollBox" class="poll-box"></div>
            </section>

            <section class="detail-card">
              <h2>Security</h2>
              <div class="feature-tags">
                <span>2FA</span><span>E2EE-ready</span><span>Audit logs</span><span>Rate limits</span>
              </div>
            </section>
          </aside>
        </div>
      </main>
    </div>

    <dialog id="modal" class="modal">
      <button id="closeModal" class="icon-btn modal__close" title="Close">×</button>
      <div id="modalBody"></div>
    </dialog>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
